<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Квантовый сапёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070912;
  --slate:#121728;
  --rift:#1D2440;
  --quantum:#7B61FF;
  --sonar:#31E1C4;
  --entropy:#FFB020;
  --rupture:#FF4D6D;
  --text:#EAECF7;
  --muted:#8A93B5;
  --line:rgba(255,255,255,.07);
  --gap:3px;
  --cell:32px;
  --r:7px;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:
    radial-gradient(900px 520px at 50% -12%, rgba(123,97,255,.20), transparent 65%),
    radial-gradient(700px 400px at 88% 8%, rgba(49,225,196,.08), transparent 60%),
    var(--void);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
.app{max-width:1340px;margin:0 auto;padding:18px 18px 34px;display:flex;flex-direction:column;gap:13px;min-height:100vh}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{
  font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(18px,2.3vw,25px);
  letter-spacing:-.035em;margin:0;white-space:nowrap;
  background:linear-gradient(92deg,var(--text) 25%,var(--quantum));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{margin:0;color:var(--muted);font-size:13px;white-space:nowrap}
@media(max-width:1000px){.brand p{display:none}}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}

/* ---------- controls ---------- */
.btn{
  font:inherit;font-weight:600;font-size:14px;color:var(--text);
  background:var(--slate);border:1px solid var(--line);border-radius:10px;
  padding:9px 14px;min-height:44px;display:inline-flex;align-items:center;gap:8px;
  cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease);
}
.btn:hover:not(:disabled){background:var(--rift);border-color:rgba(123,97,255,.5)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#8672ff,#6a4ff0);border-color:transparent}
.btn.primary:hover{background:linear-gradient(180deg,#9585ff,#7a60ff)}
.btn.icon{padding:0;width:44px;justify-content:center}
.btn svg{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--sonar);outline-offset:2px}

.seg{display:flex;background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{
  font:inherit;font-weight:600;font-size:13px;color:var(--muted);background:transparent;border:0;
  border-radius:8px;padding:8px 12px;min-height:36px;cursor:pointer;transition:color .18s var(--ease),background .18s var(--ease);
}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--rift);color:var(--text);box-shadow:inset 0 0 0 1px rgba(123,97,255,.45)}

/* ---------- console ---------- */
.console{
  display:flex;align-items:center;flex-wrap:wrap;gap:10px 0;
  border:1px solid var(--line);border-radius:16px;padding:11px 8px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 44px -34px rgba(0,0,0,.95);
}
.console>*{padding:1px 18px}
.console>*+*{box-shadow:inset 1px 0 0 var(--line)}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.stat .v{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;
  font-variant-numeric:tabular-nums;line-height:1.25;letter-spacing:-.02em;
}
.entropy{flex:1 1 210px;min-width:180px}
.entropy .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.entropy .head .v{font-size:16px;color:var(--entropy)}

.meter{height:10px;border-radius:99px;background:#080B15;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin-top:6px;position:relative}
.meter i{
  display:block;height:100%;width:100%;transform-origin:left;border-radius:99px;
  background:linear-gradient(90deg,#c97d12,var(--entropy) 60%,#ffd989);
  box-shadow:0 0 14px rgba(255,176,32,.45);
  transition:transform .45s var(--ease),background .3s var(--ease);
}
.meter::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(7,9,18,.6) 0 1px,transparent 1px 10%);
}
.meter.empty i{background:linear-gradient(90deg,var(--rupture),#ff8098);box-shadow:0 0 14px rgba(255,77,109,.4)}
.stat.locked .head .v{color:var(--rupture)}

/* ---------- tools ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.cost{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--entropy)}
.btn[aria-pressed="true"]{border-color:rgba(49,225,196,.6);color:var(--sonar);background:rgba(49,225,196,.08)}
@media(max-width:820px){
  .console>*{padding:1px 12px}
  .console>*+*{box-shadow:none}
  .tools{margin-left:0;width:100%;padding-top:4px}
}

/* ---------- board ---------- */
.board-wrap{
  flex:1;display:flex;border:1px solid var(--line);border-radius:22px;padding:16px;position:relative;overflow:auto;
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(123,97,255,.09), transparent 60%),
    rgba(8,11,20,.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 40px 90px -60px rgba(123,97,255,.75);
}
.board{
  display:grid;gap:var(--gap);
  grid-template-columns:repeat(var(--w),var(--cell));
  margin:auto;width:max-content;position:relative;
}
.cell{
  width:var(--cell);height:var(--cell);border:0;padding:0;
  border-radius:clamp(5px,calc(var(--cell) * .2),11px);
  font-family:'JetBrains Mono',monospace;font-weight:700;
  font-size:calc(var(--cell) * .5);line-height:1;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(158deg,#232B46,#161C31);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.35);
  color:var(--text);cursor:pointer;position:relative;
  transition:background .16s var(--ease),box-shadow .16s var(--ease);
}
.cell:hover:not(.open){
  background:linear-gradient(158deg,#33406B,#1D2440);
  box-shadow:inset 0 0 0 1px rgba(123,97,255,.65),0 2px 10px rgba(123,97,255,.22);
}
.cell.sup::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(123,97,255,.55);
  animation:sup 2.8s ease-in-out infinite;pointer-events:none;
}
@keyframes sup{0%,100%{opacity:.25}50%{opacity:.85}}
.cell.open{
  background:#0A0E1C;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);cursor:default;
  animation:pop .28s var(--ease) both;animation-delay:var(--d,0ms);
}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.cell.collapse{animation:collapse .5s var(--ease)}
@keyframes collapse{
  0%{box-shadow:0 0 0 0 rgba(123,97,255,.9),inset 0 0 0 1px rgba(123,97,255,1)}
  100%{box-shadow:0 0 0 16px rgba(123,97,255,0),inset 0 0 0 1px rgba(255,255,255,.05)}
}
.cell.flag{color:var(--entropy)}
.cell.mine{background:#161B2E}
.cell.mine svg{color:var(--muted)}
.cell.boom{background:linear-gradient(180deg,#4A1226,#2A0B18)}
.cell.boom svg{color:var(--rupture)}
.cell.wrong{background:#1A1226}
.cell.wrong svg{color:var(--rupture);opacity:.7}
.board:focus{outline:none}
.board:focus .cell.cursor{box-shadow:inset 0 0 0 2px var(--sonar)}
.cell svg{width:60%;height:60%}
.n1{color:#4CC9F0}.n2{color:#4ADE80}.n3{color:#FB7185}.n4{color:#A78BFA}
.n5{color:#FBBF24}.n6{color:#2DD4BF}.n7{color:#F472B6}.n8{color:#94A3B8}

.heat{position:absolute;inset:0;border-radius:inherit;pointer-events:none;display:flex;align-items:center;justify-content:center}
.heat span{font-family:'JetBrains Mono',monospace;font-size:calc(var(--cell) * .32);font-weight:700;opacity:.92}

.toast{
  position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:20;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:var(--entropy);
  text-shadow:0 2px 10px rgba(0,0,0,.8);animation:float 1.1s var(--ease) forwards;
}
@keyframes float{0%{opacity:0;transform:translate(-50%,-20%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%)}}

.hint{
  color:var(--muted);font-size:13.5px;margin:0;min-height:20px;
  padding-left:12px;border-left:2px solid rgba(123,97,255,.5);
}
.hint b{color:var(--text);font-weight:700}

/* ---------- custom panel ---------- */
.custom{display:none;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;
  border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.02)}
.custom.on{display:flex}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input{
  font:inherit;font-family:'JetBrains Mono',monospace;width:96px;min-height:44px;
  background:var(--void);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 12px;
}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(4,6,14,.78);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
}
.scrim.on{display:flex;animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:min(520px,100%);background:linear-gradient(180deg,#161C31,#0E1220);
  border:1px solid rgba(123,97,255,.28);border-radius:20px;padding:26px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .28s var(--ease)
}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:'Unbounded',sans-serif;font-size:22px;margin:0 0 8px;letter-spacing:-.02em}
.sheet p{color:var(--muted);margin:0 0 16px}
.sheet ul{margin:0 0 18px;padding-left:18px;color:var(--muted)}
.sheet li{margin-bottom:8px}
.sheet li b{color:var(--text)}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.result{display:flex;gap:22px;margin:0 0 18px;flex-wrap:wrap}
.result div{display:flex;flex-direction:column}
.result .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.result .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px}

@media (prefers-reduced-motion:reduce){
  *,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <h1>Квантовый сапёр</h1>
      <p>Мины не существуют, пока на них не посмотришь</p>
    </div>
    <div class="seg" id="diffs" role="group" aria-label="Размер поля">
      <button data-d="easy" aria-pressed="false" title="12×12, 18 мин">Малое</button>
      <button data-d="normal" aria-pressed="true" title="20×16, 55 мин">Среднее</button>
      <button data-d="hard" aria-pressed="false" title="32×18, 112 мин">Большое</button>
      <button data-d="custom" aria-pressed="false" title="Свои размеры">Своё</button>
    </div>
    <div class="top-actions">
      <button class="btn icon" id="help" aria-label="Как это работает">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.8-.9 1.4v.5"/><path d="M12 17h.01"/></svg>
      </button>
      <button class="btn primary" id="restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Заново
      </button>
    </div>
  </div>

  <div class="custom" id="customPanel">
    <div class="field"><label for="cw">Ширина</label><input id="cw" type="number" min="5" max="42" value="24"></div>
    <div class="field"><label for="ch">Высота</label><input id="ch" type="number" min="5" max="26" value="18"></div>
    <div class="field"><label for="cm">Мины</label><input id="cm" type="number" min="1" max="600" value="80"></div>
    <button class="btn primary" id="applyCustom">Применить</button>
  </div>

  <div class="console">
    <div class="stat"><span class="k">Мины</span><span class="v" id="mineCount">0</span></div>
    <div class="stat"><span class="k">Время</span><span class="v" id="clock">0:00</span></div>
    <div class="stat"><span class="k">Рекорд</span><span class="v" id="best">—</span></div>
    <div class="stat entropy" id="entropyStat">
      <div class="head"><span class="k">Энтропия</span><span class="v" id="entropyVal">0</span></div>
      <div class="meter" id="meter"><i id="meterFill"></i></div>
    </div>
    <div class="tools">
      <button class="btn" id="sonar" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 12h.01"/><path d="M8.5 15.5a5 5 0 0 1 0-7"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.5 18.5a9 9 0 0 1 0-13"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        Сонар <span class="cost">−10</span>
      </button>
      <button class="btn" id="cascade">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h6"/><path d="M4 12h10"/><path d="M4 18h7"/><path d="m16 9 4 3-4 3"/></svg>
        Каскад
      </button>
      <button class="btn" id="mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 21V4h9l-1.5 3L15 10H6"/></svg>
        Режим: открыть
      </button>
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board" tabindex="0" role="grid" aria-label="Игровое поле"></div>
  </div>

  <p class="hint" id="hint">Первый ход всегда безопасен.</p>
</div>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Заголовок</h2>
    <div id="sheetBody"></div>
    <div class="row" id="sheetRow"></div>
  </div>
</div>

<script>
const SVG_FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4h11l-2 3.5L17 11H6"/></svg>';
const SVG_MINE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>';

const PRESETS = {
  easy:   {w:12, h:12, m:18,  e:120},
  normal: {w:20, h:16, m:55,  e:110},
  hard:   {w:32, h:18, m:112, e:90},
};
const SONAR_COST = 10;
const SOLUTION_CAP = 120000;
const RESERVOIR = 40;

const el = id => document.getElementById(id);
const boardEl = el('board'), wrapEl = el('boardWrap');

let W, H, M, SIZE, NB;
let G = null;
let difficulty = 'normal';
let flagMode = false;
let sonarOn = false;
let sonarProbs = null;
let cursor = 0;
let cells = [];

/* ---------------- storage ---------------- */
const Store = {
  async get(key){
    try{
      if(window.storage){ const r = await window.storage.get(key); return r ? r.value : null; }
      return localStorage.getItem(key);
    }catch(e){ return null; }
  },
  async set(key, value){
    try{
      if(window.storage) await window.storage.set(key, value);
      else localStorage.setItem(key, value);
    }catch(e){}
  }
};
const bestKey = () => 'qms:best:' + (difficulty === 'custom' ? `${W}x${H}x${M}` : difficulty);

/* ---------------- setup ---------------- */
function buildNeighbors(){
  NB = new Array(SIZE);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const list=[];
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(!dx && !dy) continue;
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      list.push(ny*W+nx);
    }
    NB[y*W+x]=list;
  }
}

function newGame(){
  const p = difficulty === 'custom' ? G.preset : PRESETS[difficulty];
  W=p.w; H=p.h; M=p.m; SIZE=W*H;
  buildNeighbors();
  G = {
    preset:p,
    revealed:new Uint8Array(SIZE),
    num:new Int8Array(SIZE),
    flag:new Uint8Array(SIZE),
    entropy:p.e, entropyMax:p.e,
    openCount:0, flagCount:0,
    started:false, over:false, won:false,
    startedAt:0, elapsed:0,
  };
  sonarOn=false; sonarProbs=null; cursor=0;
  el('sonar').setAttribute('aria-pressed','false');
  renderBoard();
  fitBoard();
  el('clock').textContent = '0:00';
  updateHud();
  setHint('Первый ход всегда безопасен.');
  loadBest();
}

function renderBoard(){
  boardEl.style.setProperty('--w', W);
  boardEl.innerHTML = '';
  cells = new Array(SIZE);
  const frag = document.createDocumentFragment();
  for(let i=0;i<SIZE;i++){
    const c = document.createElement('div');
    c.className='cell';
    c.dataset.i=i;
    c.setAttribute('role','gridcell');
    frag.appendChild(c);
    cells[i]=c;
  }
  boardEl.appendChild(frag);
  paintAll();
}

function fitBoard(){
  const gap = 3;
  const byWidth = Math.floor((wrapEl.clientWidth - 34 - (W-1)*gap) / W);
  const room = window.innerHeight - wrapEl.getBoundingClientRect().top - 82;
  const byHeight = Math.floor((room - 34 - (H-1)*gap) / H);
  const size = Math.max(21, Math.min(byWidth, byHeight, 58));
  boardEl.style.setProperty('--cell', size + 'px');
}
window.addEventListener('resize', () => { if(G) fitBoard(); });

/* ---------------- rendering ---------------- */
function paintCell(i){
  const c = cells[i];
  c.className = 'cell';
  c.innerHTML = '';
  if(G.revealed[i]){
    c.classList.add('open');
    const n = G.num[i];
    if(n>0){ c.textContent = n; c.classList.add('n'+n); }
    c.setAttribute('aria-label', n>0 ? `открыто, ${n}` : 'открыто, пусто');
  }else if(G.flag[i]){
    c.classList.add('flag');
    c.innerHTML = SVG_FLAG;
    c.setAttribute('aria-label','флаг');
  }else{
    c.setAttribute('aria-label','закрыто');
    if(isFrontier(i)) c.classList.add('sup');
    if(sonarProbs) paintHeat(i);
  }
  if(i===cursor) c.classList.add('cursor');
}

function paintHeat(i){
  const p = sonarProbs[i];
  const layer = document.createElement('div');
  layer.className='heat';
  layer.style.background = `rgba(49,225,196,${(0.10 + p*0.72).toFixed(3)})`;
  const color = p > 0.45 ? '#04211C' : 'rgba(214,244,238,.8)';
  layer.innerHTML = `<span style="color:${color}">${Math.round(p*100)}</span>`;
  cells[i].appendChild(layer);
}

function isFrontier(i){
  if(G.revealed[i]) return false;
  for(const n of NB[i]) if(G.revealed[n]) return true;
  return false;
}

function paintAll(){ for(let i=0;i<SIZE;i++) paintCell(i); }

function updateHud(){
  el('mineCount').textContent = M - G.flagCount;
  el('entropyVal').textContent = Math.round(G.entropy);
  el('meterFill').style.transform = `scaleX(${Math.max(0, G.entropy/G.entropyMax)})`;
  el('meter').classList.toggle('empty', G.entropy < 1);
  el('entropyStat').classList.toggle('locked', G.entropy < 1);
  el('sonar').disabled = G.over || G.entropy < SONAR_COST;
  el('cascade').disabled = G.over;
}

function setHint(text){ el('hint').innerHTML = text; }

function tick(){
  if(!G.started || G.over) return;
  G.elapsed = Math.floor((Date.now() - G.startedAt)/1000);
  el('clock').textContent = fmt(G.elapsed);
}
setInterval(tick, 250);
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

async function loadBest(){
  const v = await Store.get(bestKey());
  el('best').textContent = v ? fmt(Number(v)) : '—';
}

/* ---------------- solver ---------------- */
function binom(n,k){
  if(k<0||k>n) return 0;
  k = Math.min(k, n-k);
  let r=1;
  for(let i=1;i<=k;i++) r = r*(n-k+i)/i;
  return r;
}

function conv(a,b,limit){
  const len = Math.min(a.length + b.length - 1, limit+1);
  const r = new Float64Array(len);
  for(let i=0;i<a.length;i++){
    if(!a[i]) continue;
    for(let j=0;j<b.length && i+j<len;j++){
      if(b[j]) r[i+j] += a[i]*b[j];
    }
  }
  return r;
}

function solveComponent(cellIds, constraints, maxMines){
  const n = cellIds.length;
  const local = new Map();
  cellIds.forEach((g,i) => local.set(g,i));
  const cons = constraints.map(c => ({t:c.t, cells:c.cells.map(g => local.get(g))}));
  const cellCons = Array.from({length:n}, () => []);
  cons.forEach((c,ci) => c.cells.forEach(li => cellCons[li].push(ci)));

  const order=[], seen=new Uint8Array(n);
  for(let s=0;s<n;s++){
    if(seen[s]) continue;
    seen[s]=1;
    const queue=[s];
    while(queue.length){
      const li = queue.shift();
      order.push(li);
      for(const ci of cellCons[li]) for(const nb of cons[ci].cells)
        if(!seen[nb]){ seen[nb]=1; queue.push(nb); }
    }
  }

  const sum = new Int32Array(cons.length);
  const rest = new Int32Array(cons.length);
  cons.forEach((c,i) => rest[i] = c.cells.length);
  const assign = new Uint8Array(n);
  const counts=[], mineCounts=[], samples=[];
  let total=0, aborted=false;

  const record = k => {
    counts[k] = (counts[k]||0) + 1;
    let mc = mineCounts[k] || (mineCounts[k] = new Float64Array(n));
    for(let i=0;i<n;i++) if(assign[i]) mc[i]++;
    const s = samples[k] || (samples[k] = []);
    if(s.length < RESERVOIR) s.push(assign.slice());
    else {
      const j = Math.floor(Math.random()*counts[k]);
      if(j < RESERVOIR) s[j] = assign.slice();
    }
  };

  const walk = (pos, mines) => {
    if(aborted || mines > maxMines) return;
    if(pos === n){ total++; record(mines); if(total >= SOLUTION_CAP) aborted = true; return; }
    const li = order[pos], cs = cellCons[li];
    for(let val=0; val<2; val++){
      let ok = true;
      for(const ci of cs){
        sum[ci]+=val; rest[ci]--;
        if(sum[ci] > cons[ci].t || sum[ci] + rest[ci] < cons[ci].t) ok = false;
      }
      if(ok){ assign[li]=val; walk(pos+1, mines+val); }
      for(const ci of cs){ sum[ci]-=val; rest[ci]++; }
      if(aborted) break;
    }
    assign[li]=0;
  };
  walk(0,0);

  const len = counts.length;
  const dist = new Float64Array(len);
  for(let k=0;k<len;k++) dist[k] = counts[k] || 0;
  return {n, cellIds, dist, mineCounts, samples, total, aborted};
}

function analyze(forcedEmpty){
  const varOf = new Int32Array(SIZE).fill(-1);
  const vars = [];
  for(let i=0;i<SIZE;i++){
    if(G.revealed[i] || i === forcedEmpty) continue;
    varOf[i] = vars.length;
    vars.push(i);
  }
  const cons = [];
  for(let i=0;i<SIZE;i++){
    if(!G.revealed[i]) continue;
    const t = G.num[i], list = [];
    for(const nb of NB[i]) if(varOf[nb] >= 0) list.push(varOf[nb]);
    if(list.length === 0){ if(t !== 0) return {unsat:true}; continue; }
    if(t > list.length) return {unsat:true};
    if(t === 0 && list.length === 0) continue;
    cons.push({t, cells:list});
  }

  const parent = new Int32Array(vars.length);
  for(let i=0;i<vars.length;i++) parent[i]=i;
  const find = x => { while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
  const union = (a,b) => { a=find(a); b=find(b); if(a!==b) parent[a]=b; };
  for(const c of cons) for(let j=1;j<c.cells.length;j++) union(c.cells[0], c.cells[j]);

  const bound = new Uint8Array(vars.length);
  for(const c of cons) for(const v of c.cells) bound[v]=1;
  const groups = new Map(), consBy = new Map();
  for(let v=0;v<vars.length;v++){
    if(!bound[v]) continue;
    const r = find(v);
    (groups.get(r) || groups.set(r, []).get(r)).push(v);
  }
  for(const c of cons){
    const r = find(c.cells[0]);
    (consBy.get(r) || consBy.set(r, []).get(r)).push(c);
  }
  const sea = [];
  for(let v=0;v<vars.length;v++) if(!bound[v]) sea.push(v);

  const comps = [];
  for(const [root, list] of groups){
    const res = solveComponent(list, consBy.get(root) || [], M);
    if(res.total === 0) return {unsat:true};
    comps.push(res);
  }

  const seaN = sea.length;
  const dists = comps.map(c => c.dist);
  const prefix = [new Float64Array([1])];
  for(let i=0;i<dists.length;i++) prefix.push(conv(prefix[i], dists[i], M));
  const suffix = new Array(dists.length+1);
  suffix[dists.length] = new Float64Array([1]);
  for(let i=dists.length-1;i>=0;i--) suffix[i] = conv(dists[i], suffix[i+1], M);

  const full = prefix[dists.length];
  const weights = new Float64Array(full.length);
  let total = 0;
  for(let k=0;k<full.length;k++){
    if(!full[k]) continue;
    const w = full[k] * binom(seaN, M-k);
    weights[k] = w;
    total += w;
  }
  if(!(total > 0)) return {unsat:true};

  const probs = new Float64Array(SIZE);
  for(let i=0;i<comps.length;i++){
    const excl = conv(prefix[i], suffix[i+1], M);
    const scale = new Float64Array(comps[i].dist.length);
    for(let k=0;k<scale.length;k++){
      let s = 0;
      for(let kk=0;kk<excl.length;kk++){
        if(excl[kk]) s += excl[kk] * binom(seaN, M-k-kk);
      }
      scale[k] = s;
    }
    const comp = comps[i];
    for(let li=0; li<comp.n; li++){
      let acc = 0;
      for(let k=0;k<scale.length;k++){
        const mc = comp.mineCounts[k];
        if(mc && mc[li]) acc += mc[li] * scale[k];
      }
      probs[vars[comp.cellIds[li]]] = Math.min(1, acc/total);
    }
  }
  if(seaN > 0){
    let acc = 0;
    for(let k=0;k<weights.length;k++) if(weights[k]) acc += weights[k] * (M-k)/seaN;
    const p = Math.min(1, acc/total);
    for(const v of sea) probs[vars[v]] = p;
  }

  const sample = () => {
    let r = Math.random()*total, K = -1;
    for(let k=0;k<weights.length;k++){
      if(!weights[k]) continue;
      r -= weights[k];
      if(r <= 0){ K = k; break; }
    }
    if(K < 0) for(let k=weights.length-1;k>=0;k--) if(weights[k]){ K=k; break; }

    const board = new Uint8Array(SIZE);
    let left = K;
    for(let i=0;i<comps.length;i++){
      const dist = comps[i].dist, suf = suffix[i+1];
      const ws = new Float64Array(dist.length);
      let tw = 0;
      for(let k=0;k<dist.length;k++){
        const idx = left - k;
        if(!dist[k] || idx < 0 || idx >= suf.length) continue;
        ws[k] = dist[k] * suf[idx];
        tw += ws[k];
      }
      let rr = Math.random()*tw, pick = -1;
      for(let k=0;k<ws.length;k++){
        if(!ws[k]) continue;
        rr -= ws[k];
        if(rr <= 0){ pick = k; break; }
      }
      if(pick < 0) for(let k=ws.length-1;k>=0;k--) if(ws[k]){ pick=k; break; }
      if(pick < 0) pick = 0;
      const pool = comps[i].samples[pick] || [];
      const sol = pool[Math.floor(Math.random()*pool.length)];
      if(sol) for(let li=0; li<comps[i].n; li++) if(sol[li]) board[vars[comps[i].cellIds[li]]] = 1;
      left -= pick;
    }
    const need = Math.max(0, Math.min(seaN, M-K));
    const pool = sea.slice();
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    for(let i=0;i<need;i++) board[vars[pool[i]]] = 1;
    return board;
  };

  return {unsat:false, probs, sample, approx: comps.some(c => c.aborted)};
}

function firstBoard(start){
  const forbidden = new Set([start, ...NB[start]]);
  let pool = [];
  for(let i=0;i<SIZE;i++) if(!forbidden.has(i)) pool.push(i);
  if(pool.length < M){
    pool = [];
    for(let i=0;i<SIZE;i++) if(i !== start) pool.push(i);
  }
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const board = new Uint8Array(SIZE);
  for(let i=0;i<M;i++) board[pool[i]] = 1;
  return board;
}

/* ---------------- game actions ---------------- */
function floodOpen(start, board){
  const stack = [start], opened = [];
  while(stack.length){
    const i = stack.pop();
    if(G.revealed[i]) continue;
    if(G.flag[i]){ G.flag[i]=0; G.flagCount--; }
    G.revealed[i] = 1;
    G.openCount++;
    opened.push(i);
    let n = 0;
    for(const nb of NB[i]) if(board[nb]) n++;
    G.num[i] = n;
    if(n === 0) for(const nb of NB[i]) if(!G.revealed[nb]) stack.push(nb);
  }
  return opened;
}

function animateOpen(opened, origin){
  const ox = origin % W, oy = Math.floor(origin / W);
  for(const i of opened){
    const d = Math.max(Math.abs(i%W - ox), Math.abs(Math.floor(i/W) - oy));
    paintCell(i);
    cells[i].style.setProperty('--d', Math.min(320, d*26) + 'ms');
  }
  for(const i of opened) for(const nb of NB[i]) if(!G.revealed[nb]) paintCell(nb);
}

function startClock(){
  if(G.started) return;
  G.started = true;
  G.startedAt = Date.now();
}

function reveal(i){
  if(G.over || G.revealed[i] || G.flag[i]) return;
  startClock();
  clearSonar();

  if(G.openCount === 0){
    const board = firstBoard(i);
    animateOpen(floodOpen(i, board), i);
    afterMove('Поле схлопывается только там, где этого требует логика.');
    return;
  }

  const base = analyze(null);
  if(base.unsat){ collapseFail(i, null); return; }
  const p = base.probs[i];

  if(p <= 1e-9){
    animateOpen(floodOpen(i, base.sample()), i);
    afterMove('Ход был безопасен во всех вселенных — энтропия не потрачена.');
    return;
  }

  const forced = analyze(i);
  if(forced.unsat){ collapseFail(i, base, true); return; }

  const cost = Math.max(1, Math.min(100, Math.ceil(p*100)));
  if(G.entropy >= cost){
    G.entropy -= cost;
    toast(i, '−' + cost);
    animateOpen(floodOpen(i, forced.sample()), i);
    cells[i].classList.add('collapse');
    afterMove(`Суперпозиция схлопнута в твою пользу. Риск был <b>${Math.round(p*100)}%</b>.`);
    return;
  }

  if(Math.random() < p){ collapseFail(i, base); return; }
  animateOpen(floodOpen(i, forced.sample()), i);
  afterMove(`Энтропия на нуле — повезло. Риск был <b>${Math.round(p*100)}%</b>.`);
}

function afterMove(message){
  if(G.openCount >= SIZE - M){ win(); return; }
  updateHud();
  setHint(message);
}

function collapseFail(i, base, forcedDeath){
  const analysis = base && !base.unsat ? base : analyze(null);
  let board = null;
  if(!analysis.unsat){
    for(let t=0;t<40;t++){
      const b = analysis.sample();
      if(b[i]){ board = b; break; }
      board = b;
    }
  }
  if(!board) board = new Uint8Array(SIZE);
  board[i] = 1;
  endGame(false, board, i, forcedDeath);
}

function chord(i){
  if(!G.revealed[i] || G.num[i] === 0) return;
  let flags = 0;
  const targets = [];
  for(const nb of NB[i]){
    if(G.flag[nb]) flags++;
    else if(!G.revealed[nb]) targets.push(nb);
  }
  if(flags !== G.num[i] || !targets.length) return;
  for(const t of targets){
    if(G.over) return;
    reveal(t);
  }
}

function toggleFlag(i){
  if(G.over || G.revealed[i]) return;
  G.flag[i] = G.flag[i] ? 0 : 1;
  G.flagCount += G.flag[i] ? 1 : -1;
  paintCell(i);
  updateHud();
}

function useSonar(){
  if(G.over || G.entropy < SONAR_COST) return;
  if(sonarOn){ clearSonar(); return; }
  if(G.openCount === 0){ setHint('Сонару нечего измерять — сделай первый ход.'); return; }
  const res = analyze(null);
  if(res.unsat){ setHint('Состояние поля противоречиво.'); return; }
  G.entropy -= SONAR_COST;
  sonarProbs = res.probs;
  sonarOn = true;
  el('sonar').setAttribute('aria-pressed','true');
  paintAll();
  updateHud();
  setHint('Сонар показывает вероятность мины в каждой закрытой клетке.');
}

function clearSonar(){
  if(!sonarOn) return;
  sonarOn = false;
  sonarProbs = null;
  el('sonar').setAttribute('aria-pressed','false');
  paintAll();
}

function useCascade(){
  if(G.over) return;
  if(G.openCount === 0){ setHint('Каскаду нужна хотя бы одна открытая клетка.'); return; }
  const res = analyze(null);
  if(res.unsat){ setHint('Состояние поля противоречиво.'); return; }
  const safe = [], sure = [];
  for(let i=0;i<SIZE;i++){
    if(G.revealed[i] || G.flag[i]) continue;
    if(res.probs[i] <= 1e-9) safe.push(i);
    else if(res.probs[i] >= 1-1e-9) sure.push(i);
  }
  if(!safe.length && !sure.length){
    setHint('Чистой логики не осталось — дальше только схлопывание.');
    return;
  }
  for(const i of sure){ if(!G.flag[i]){ G.flag[i]=1; G.flagCount++; paintCell(i); } }
  if(safe.length){
    const board = res.sample();
    startClock();
    clearSonar();
    for(const i of safe){
      if(G.revealed[i]) continue;
      animateOpen(floodOpen(i, board), i);
    }
  }
  paintAll();
  if(G.openCount >= SIZE - M){ win(); return; }
  updateHud();
  setHint(`Каскад: открыто <b>${safe.length}</b>, помечено <b>${sure.length}</b>. Бесплатно — это чистая логика.`);
}

function toast(i, text){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  t.style.left = (cells[i].offsetLeft + cells[i].offsetWidth/2) + 'px';
  t.style.top = (cells[i].offsetTop + cells[i].offsetHeight/2) + 'px';
  boardEl.appendChild(t);
  setTimeout(() => t.remove(), 1200);
}

/* ---------------- end states ---------------- */
function endGame(won, board, boomIndex, forcedDeath){
  G.over = true;
  G.won = won;
  clearSonar();
  for(let i=0;i<SIZE;i++){
    if(G.revealed[i]) continue;
    const isMine = board ? board[i] === 1 : false;
    const c = cells[i];
    c.className = 'cell';
    c.innerHTML = '';
    if(isMine && G.flag[i]){ c.classList.add('flag'); c.innerHTML = SVG_FLAG; }
    else if(isMine){ c.classList.add(i === boomIndex ? 'boom' : 'mine'); c.innerHTML = SVG_MINE; }
    else if(G.flag[i]){ c.classList.add('wrong'); c.innerHTML = SVG_MINE; }
  }
  updateHud();
  if(won) showWin(); else showLoss(forcedDeath);
}

async function win(){
  const res = analyze(null);
  const board = res.unsat ? null : res.sample();
  endGame(true, board, -1);
  const key = bestKey();
  const prev = await Store.get(key);
  if(!prev || G.elapsed < Number(prev)){
    await Store.set(key, String(G.elapsed));
    el('best').textContent = fmt(G.elapsed);
  }
}

function showWin(){
  openSheet('Поле разминировано', `
    <div class="result">
      <div><span class="k">Время</span><span class="v">${fmt(G.elapsed)}</span></div>
      <div><span class="k">Энтропия</span><span class="v">${Math.round(G.entropy)}</span></div>
      <div><span class="k">Мины</span><span class="v">${M}</span></div>
    </div>
    <p>${G.entropy === G.entropyMax ? 'Ни одного схлопывания — вся партия на чистой логике.' : 'Вселенная несколько раз подыграла, но результат есть.'}</p>
  `, [{label:'Ещё раз', primary:true, action:newGame}]);
}

function showLoss(forcedDeath){
  const text = forcedDeath
    ? 'Эта клетка была миной во всех допустимых вселенных. Логика запрещала такой ход.'
    : 'Энтропия кончилась, поле зафиксировалось — и мина оказалась именно здесь.';
  openSheet('Схлопнулось не в твою пользу', `
    <p>${text}</p>
    <div class="result">
      <div><span class="k">Открыто</span><span class="v">${G.openCount} / ${SIZE - M}</span></div>
      <div><span class="k">Время</span><span class="v">${fmt(G.elapsed)}</span></div>
    </div>
  `, [{label:'Ещё раз', primary:true, action:newGame}, {label:'Посмотреть поле', action:closeSheet}]);
}

    <ul>
      <li><b>Клик по клетке.</b> Игра проверяет, существует ли вселенная, где эта клетка пуста. Если да — она пуста.</li>

      <li>Умереть на логически обоснованном ходе нельзя. Умереть можно только там, где мина была неизбежна, или когда энтропия кончилась.</li>

  `, [{label:'Понятно', primary:true, action:closeSheet}]);

function openSheet(title, body, buttons){
  el('sheetTitle').textContent = title;
  el('sheetBody').innerHTML = body;
  const row = el('sheetRow');
  row.innerHTML = '';
  for(const b of buttons){
    const btn = document.createElement('button');
    btn.className = 'btn' + (b.primary ? ' primary' : '');
    btn.textContent = b.label;
    btn.onclick = () => { closeSheet(); b.action(); };
    row.appendChild(btn);
  }
  el('scrim').classList.add('on');
  row.firstChild?.focus();
}
function closeSheet(){ el('scrim').classList.remove('on'); }

/* ---------------- input ---------------- */
let pressTimer = null, longPressed = false;

boardEl.addEventListener('contextmenu', e => {
  e.preventDefault();
  const i = indexFrom(e.target);
  if(i >= 0) toggleFlag(i);
});

boardEl.addEventListener('mousedown', e => {
  const i = indexFrom(e.target);
  if(i < 0) return;
  if(e.button === 1){ e.preventDefault(); chord(i); }
});

boardEl.addEventListener('click', e => {
  const i = indexFrom(e.target);
  if(i < 0 || longPressed) return;
  cursor = i;
  if(G.revealed[i]) return;
  if(flagMode) toggleFlag(i);
  else reveal(i);
  paintCursor();
});

boardEl.addEventListener('dblclick', e => {
  const i = indexFrom(e.target);
  if(i >= 0) chord(i);
});

boardEl.addEventListener('touchstart', e => {
  const i = indexFrom(e.target);
  if(i < 0) return;
  longPressed = false;
  pressTimer = setTimeout(() => {
    longPressed = true;
    toggleFlag(i);
    if(navigator.vibrate) navigator.vibrate(18);
  }, 380);
}, {passive:true});

const cancelPress = () => { clearTimeout(pressTimer); setTimeout(() => longPressed = false, 60); };
boardEl.addEventListener('touchend', cancelPress);
boardEl.addEventListener('touchmove', cancelPress, {passive:true});

function indexFrom(target){
  const cell = target.closest('.cell');
  return cell ? Number(cell.dataset.i) : -1;
}

function paintCursor(){
  for(const c of cells) c.classList.remove('cursor');
  cells[cursor]?.classList.add('cursor');
}

boardEl.addEventListener('keydown', e => {
  const x = cursor % W, y = Math.floor(cursor / W);
  const moves = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
  if(moves[e.key]){
    e.preventDefault();
    const nx = Math.min(W-1, Math.max(0, x + moves[e.key][0]));
    const ny = Math.min(H-1, Math.max(0, y + moves[e.key][1]));
    cursor = ny*W + nx;
    paintCursor();
    return;
  }
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); G.revealed[cursor] ? chord(cursor) : reveal(cursor); paintCursor(); }
  if(e.key.toLowerCase() === 'f' || e.key.toLowerCase() === 'а'){ e.preventDefault(); toggleFlag(cursor); paintCursor(); }
});

el('restart').onclick = newGame;
el('help').onclick = showHelp;
el('sonar').onclick = useSonar;
el('cascade').onclick = useCascade;
el('mode').onclick = () => {
  flagMode = !flagMode;
  const b = el('mode');
  b.setAttribute('aria-pressed', String(flagMode));
  b.lastChild.textContent = flagMode ? ' Режим: флаг' : ' Режим: открыть';
};
el('scrim').onclick = e => { if(e.target === el('scrim')) closeSheet(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

el('diffs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  difficulty = btn.dataset.d;
  for(const b of el('diffs').children) b.setAttribute('aria-pressed', String(b === btn));
  el('customPanel').classList.toggle('on', difficulty === 'custom');
  if(difficulty !== 'custom') newGame();
  else fitBoard();
});

el('applyCustom').onclick = () => {
  const w = Math.min(40, Math.max(5, Number(el('cw').value) || 20));
  const h = Math.min(24, Math.max(5, Number(el('ch').value) || 14));
  const maxMines = w*h - 10;
  const m = Math.min(maxMines, Math.max(1, Number(el('cm').value) || 40));
  el('cw').value = w; el('ch').value = h; el('cm').value = m;
  G = {preset:{w, h, m, e: Math.round(60 + 60*m/(w*h*0.25))}};
  newGame();
};

G = {preset:PRESETS.normal};
newGame();
</script>
</body>
</html>
