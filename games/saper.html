<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Сапёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070912;
  --slate:#121728;
  --rift:#1D2440;
  --accent:#7B61FF;
  --sonar:#31E1C4;
  --flag:#FFB020;
  --mine:#FF4D6D;
  --text:#EAECF7;
  --muted:#8A93B5;
  --line:rgba(255,255,255,.07);
  --gap:3px;
  --cell:32px;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:
    radial-gradient(900px 520px at 50% -12%, rgba(123,97,255,.20), transparent 65%),
    radial-gradient(700px 400px at 88% 8%, rgba(49,225,196,.08), transparent 60%),
    var(--void);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
.app{max-width:1100px;margin:0 auto;padding:18px 18px 34px;display:flex;flex-direction:column;gap:13px;min-height:100vh}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{
  font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(18px,2.3vw,25px);
  letter-spacing:-.035em;margin:0;white-space:nowrap;
  background:linear-gradient(92deg,var(--text) 25%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{margin:0;color:var(--muted);font-size:13px;white-space:nowrap}
@media(max-width:760px){.brand p{display:none}}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}

/* ---------- controls ---------- */
.btn{
  font:inherit;font-weight:600;font-size:14px;color:var(--text);
  background:var(--slate);border:1px solid var(--line);border-radius:10px;
  padding:9px 14px;min-height:44px;display:inline-flex;align-items:center;gap:8px;
  cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease);
}
.btn:hover:not(:disabled){background:var(--rift);border-color:rgba(123,97,255,.5)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#8672ff,#6a4ff0);border-color:transparent}
.btn.primary:hover{background:linear-gradient(180deg,#9585ff,#7a60ff)}
.btn.icon{padding:0;width:44px;justify-content:center}
.btn svg{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--sonar);outline-offset:2px}

.seg{display:flex;background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{
  font:inherit;font-weight:600;font-size:13px;color:var(--muted);background:transparent;border:0;
  border-radius:8px;padding:8px 12px;min-height:36px;cursor:pointer;transition:color .18s var(--ease),background .18s var(--ease);
}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--rift);color:var(--text);box-shadow:inset 0 0 0 1px rgba(123,97,255,.45)}

/* ---------- console ---------- */
.console{
  display:flex;align-items:center;flex-wrap:wrap;gap:10px 0;
  border:1px solid var(--line);border-radius:16px;padding:11px 8px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 44px -34px rgba(0,0,0,.95);
}
.console>*{padding:1px 18px}
.console>*+*{box-shadow:inset 1px 0 0 var(--line)}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.stat .v{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;
  font-variant-numeric:tabular-nums;line-height:1.25;letter-spacing:-.02em;
}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn[aria-pressed="true"]{border-color:rgba(255,176,32,.6);color:var(--flag);background:rgba(255,176,32,.08)}
@media(max-width:640px){
  .console>*{padding:1px 12px}
  .console>*+*{box-shadow:none}
  .tools{margin-left:0;width:100%;padding-top:4px}
}

/* ---------- board ---------- */
.board-wrap{
  flex:1;display:flex;border:1px solid var(--line);border-radius:22px;padding:16px;position:relative;overflow:auto;
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(123,97,255,.09), transparent 60%),
    rgba(8,11,20,.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 40px 90px -60px rgba(123,97,255,.75);
}
.board{
  display:grid;gap:var(--gap);
  grid-template-columns:repeat(var(--w),var(--cell));
  margin:auto;width:max-content;position:relative;
}
.cell{
  width:var(--cell);height:var(--cell);border:0;padding:0;
  border-radius:clamp(5px,calc(var(--cell) * .2),11px);
  font-family:'JetBrains Mono',monospace;font-weight:700;
  font-size:calc(var(--cell) * .5);line-height:1;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(158deg,#232B46,#161C31);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.35);
  color:var(--text);cursor:pointer;position:relative;
  transition:background .16s var(--ease),box-shadow .16s var(--ease);
}
.cell:hover:not(.open){
  background:linear-gradient(158deg,#33406B,#1D2440);
  box-shadow:inset 0 0 0 1px rgba(123,97,255,.65),0 2px 10px rgba(123,97,255,.22);
}
.cell.open{
  background:#0A0E1C;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);cursor:default;
  animation:pop .2s var(--ease) both;
}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.cell.flag{color:var(--flag)}
.cell.mine{background:#161B2E}
.cell.mine svg{color:var(--muted)}
.cell.boom{background:linear-gradient(180deg,#4A1226,#2A0B18)}
.cell.boom svg{color:var(--mine)}
.cell.wrong{background:#1A1226}
.cell.wrong svg{color:var(--mine);opacity:.7}
.board:focus{outline:none}
.board:focus .cell.cursor{box-shadow:inset 0 0 0 2px var(--sonar)}
.cell svg{width:60%;height:60%}
.n1{color:#4CC9F0}.n2{color:#4ADE80}.n3{color:#FB7185}.n4{color:#A78BFA}
.n5{color:#FBBF24}.n6{color:#2DD4BF}.n7{color:#F472B6}.n8{color:#94A3B8}

.hint{
  color:var(--muted);font-size:13.5px;margin:0;min-height:20px;
  padding-left:12px;border-left:2px solid rgba(123,97,255,.5);
}
.hint b{color:var(--text);font-weight:700}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(4,6,14,.78);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
}
.scrim.on{display:flex;animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:min(480px,100%);background:linear-gradient(180deg,#161C31,#0E1220);
  border:1px solid rgba(123,97,255,.28);border-radius:20px;padding:26px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .28s var(--ease)
}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:'Unbounded',sans-serif;font-size:22px;margin:0 0 8px;letter-spacing:-.02em}
.sheet p{color:var(--muted);margin:0 0 16px}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.result{display:flex;gap:22px;margin:0 0 18px;flex-wrap:wrap}
.result div{display:flex;flex-direction:column}
.result .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.result .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px}

@media (prefers-reduced-motion:reduce){
  *,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <h1>Сапёр</h1>
      <p>Классика: цифры, флаги и немного удачи</p>
    </div>
    <div class="seg" id="diffs" role="group" aria-label="Сложность">
      <button data-d="easy" aria-pressed="false" title="9×9, 10 мин">Лёгкий</button>
      <button data-d="normal" aria-pressed="true" title="16×16, 40 мин">Средний</button>
      <button data-d="hard" aria-pressed="false" title="24×20, 99 мин">Сложный</button>
    </div>
    <div class="top-actions">
      <button class="btn icon" id="help" aria-label="Как играть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.8-.9 1.4v.5"/><path d="M12 17h.01"/></svg>
      </button>
      <button class="btn primary" id="restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Заново
      </button>
    </div>
  </div>

  <div class="console">
    <div class="stat"><span class="k">Мины</span><span class="v" id="mineCount">0</span></div>
    <div class="stat"><span class="k">Время</span><span class="v" id="clock">0:00</span></div>
    <div class="stat"><span class="k">Рекорд</span><span class="v" id="best">—</span></div>
    <div class="tools">
      <button class="btn" id="mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 21V4h9l-1.5 3L15 10H6"/></svg>
        Режим: открыть
      </button>
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board" tabindex="0" role="grid" aria-label="Игровое поле"></div>
  </div>

  <p class="hint" id="hint">Первый клик всегда безопасен.</p>
</div>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Заголовок</h2>
    <div id="sheetBody"></div>
    <div class="row" id="sheetRow"></div>
  </div>
</div>

<script>
const SVG_FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4h11l-2 3.5L17 11H6"/></svg>';
const SVG_MINE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>';

const PRESETS = {
  easy:   {w:9,  h:9,  m:10},
  normal: {w:16, h:16, m:40},
  hard:   {w:24, h:20, m:99},
};

const el = id => document.getElementById(id);
const boardEl = el('board'), wrapEl = el('boardWrap');

let W, H, M, SIZE, NB;
let G = null;
let difficulty = 'normal';
let flagMode = false;
let cursor = 0;
let cells = [];

/* ---------------- storage ---------------- */
const Store = {
  async get(key){
    try{
      if(window.storage){ const r = await window.storage.get(key); return r ? r.value : null; }
      return localStorage.getItem(key);
    }catch(e){ return null; }
  },
  async set(key, value){
    try{
      if(window.storage) await window.storage.set(key, value);
      else localStorage.setItem(key, value);
    }catch(e){}
  }
};
const bestKey = () => 'saper:best:' + difficulty;

/* ---------------- setup ---------------- */
function buildNeighbors(){
  NB = new Array(SIZE);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const list=[];
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(!dx && !dy) continue;
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      list.push(ny*W+nx);
    }
    NB[y*W+x]=list;
  }
}

function newGame(){
  const p = PRESETS[difficulty];
  W=p.w; H=p.h; M=p.m; SIZE=W*H;
  buildNeighbors();
  G = {
    mines:null,
    revealed:new Uint8Array(SIZE),
    num:new Int8Array(SIZE),
    flag:new Uint8Array(SIZE),
    openCount:0, flagCount:0,
    started:false, over:false, won:false,
    startedAt:0, elapsed:0,
  };
  cursor=0;
  renderBoard();
  fitBoard();
  el('clock').textContent = '0:00';
  updateHud();
  setHint('Первый клик всегда безопасен.');
  loadBest();
}

function renderBoard(){
  boardEl.style.setProperty('--w', W);
  boardEl.innerHTML = '';
  cells = new Array(SIZE);
  const frag = document.createDocumentFragment();
  for(let i=0;i<SIZE;i++){
    const c = document.createElement('div');
    c.className='cell';
    c.dataset.i=i;
    c.setAttribute('role','gridcell');
    frag.appendChild(c);
    cells[i]=c;
  }
  boardEl.appendChild(frag);
  paintAll();
}

function fitBoard(){
  const gap = 3;
  const byWidth = Math.floor((wrapEl.clientWidth - 34 - (W-1)*gap) / W);
  const room = window.innerHeight - wrapEl.getBoundingClientRect().top - 82;
  const byHeight = Math.floor((room - 34 - (H-1)*gap) / H);
  const size = Math.max(16, Math.min(byWidth, byHeight, 40));
  boardEl.style.setProperty('--cell', size + 'px');
}
window.addEventListener('resize', () => { if(G) fitBoard(); });

/* ---------------- rendering ---------------- */
function paintCell(i){
  const c = cells[i];
  c.className = 'cell';
  c.innerHTML = '';
  if(G.revealed[i]){
    c.classList.add('open');
    const n = G.num[i];
    if(n>0){ c.textContent = n; c.classList.add('n'+n); }
    c.setAttribute('aria-label', n>0 ? `открыто, ${n}` : 'открыто, пусто');
  }else if(G.flag[i]){
    c.classList.add('flag');
    c.innerHTML = SVG_FLAG;
    c.setAttribute('aria-label','флаг');
  }else{
    c.setAttribute('aria-label','закрыто');
  }
  if(i===cursor) c.classList.add('cursor');
}

function paintAll(){ for(let i=0;i<SIZE;i++) paintCell(i); }

function updateHud(){
  el('mineCount').textContent = M - G.flagCount;
}

function setHint(text){ el('hint').innerHTML = text; }

function tick(){
  if(!G.started || G.over) return;
  G.elapsed = Math.floor((Date.now() - G.startedAt)/1000);
  el('clock').textContent = fmt(G.elapsed);
}
setInterval(tick, 250);
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

async function loadBest(){
  const v = await Store.get(bestKey());
  el('best').textContent = v ? fmt(Number(v)) : '—';
}

/* ---------------- mine placement (first-click safe) ---------------- */
function placeMines(safeIndex){
  const forbidden = new Set([safeIndex, ...NB[safeIndex]]);
  let pool = [];
  for(let i=0;i<SIZE;i++) if(!forbidden.has(i)) pool.push(i);
  if(pool.length < M){
    pool = [];
    for(let i=0;i<SIZE;i++) if(i !== safeIndex) pool.push(i);
  }
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const mines = new Uint8Array(SIZE);
  for(let i=0;i<M;i++) mines[pool[i]] = 1;
  G.mines = mines;
  for(let i=0;i<SIZE;i++){
    if(mines[i]){ G.num[i] = -1; continue; }
    let n = 0;
    for(const nb of NB[i]) if(mines[nb]) n++;
    G.num[i] = n;
  }
}

/* ---------------- game actions ---------------- */
function floodOpen(start){
  const stack = [start], opened = [];
  while(stack.length){
    const i = stack.pop();
    if(G.revealed[i] || G.flag[i]) continue;
    G.revealed[i] = 1;
    G.openCount++;
    opened.push(i);
    if(G.num[i] === 0) for(const nb of NB[i]) if(!G.revealed[nb]) stack.push(nb);
  }
  return opened;
}

function startClock(){
  if(G.started) return;
  G.started = true;
  G.startedAt = Date.now();
}

function reveal(i){
  if(G.over || G.revealed[i] || G.flag[i]) return;

  if(!G.mines){
    startClock();
    placeMines(i);
  }

  if(G.num[i] === -1){ explode(i); return; }

  const opened = floodOpen(i);
  for(const idx of opened) paintCell(idx);
  for(const idx of opened) for(const nb of NB[idx]) if(!G.revealed[nb]) paintCell(nb);

  if(G.openCount >= SIZE - M){ win(); return; }
  updateHud();
}

function chord(i){
  if(!G.revealed[i] || G.num[i] <= 0) return;
  let flags = 0;
  const targets = [];
  for(const nb of NB[i]){
    if(G.flag[nb]) flags++;
    else if(!G.revealed[nb]) targets.push(nb);
  }
  if(flags !== G.num[i] || !targets.length) return;
  for(const t of targets){
    if(G.over) return;
    reveal(t);
  }
}

function toggleFlag(i){
  if(G.over || G.revealed[i]) return;
  G.flag[i] = G.flag[i] ? 0 : 1;
  G.flagCount += G.flag[i] ? 1 : -1;
  paintCell(i);
  updateHud();
}

/* ---------------- end states ---------------- */
function explode(boomIndex){
  G.over = true;
  G.won = false;
  G.revealed[boomIndex] = 1;
  for(let i=0;i<SIZE;i++){
    const isMine = G.num[i] === -1;
    if(G.revealed[i] && i !== boomIndex) continue;
    const c = cells[i];
    c.className = 'cell';
    c.innerHTML = '';
    if(isMine && G.flag[i]){ c.classList.add('flag'); c.innerHTML = SVG_FLAG; }
    else if(isMine){ c.classList.add(i === boomIndex ? 'boom' : 'mine'); c.innerHTML = SVG_MINE; }
    else if(G.flag[i]){ c.classList.add('wrong'); c.innerHTML = SVG_MINE; }
  }
  updateHud();
  showLoss();
}

async function win(){
  G.over = true;
  G.won = true;
  for(let i=0;i<SIZE;i++){
    if(G.num[i] === -1 && !G.flag[i]){
      G.flag[i] = 1; G.flagCount++; paintCell(i);
    }
  }
  updateHud();
  showWin();
  const key = bestKey();
  const prev = await Store.get(key);
  if(!prev || G.elapsed < Number(prev)){
    await Store.set(key, String(G.elapsed));
    el('best').textContent = fmt(G.elapsed);
  }
}

function showWin(){
  openSheet('Поле разминировано', `
    <div class="result">
      <div><span class="k">Время</span><span class="v">${fmt(G.elapsed)}</span></div>
      <div><span class="k">Мины</span><span class="v">${M}</span></div>
    </div>
    <p>Отличная работа — все безопасные клетки открыты.</p>
  `, [{label:'Ещё раз', primary:true, action:newGame}]);
}

function showLoss(){
  openSheet('Бум', `
    <p>Наступил на мину. Бывает — попробуй ещё раз.</p>
    <div class="result">
      <div><span class="k">Открыто</span><span class="v">${G.openCount} / ${SIZE - M}</span></div>
      <div><span class="k">Время</span><span class="v">${fmt(G.elapsed)}</span></div>
    </div>
  `, [{label:'Ещё раз', primary:true, action:newGame}, {label:'Посмотреть поле', action:closeSheet}]);
}

function showHelp(){
  openSheet('Как играть', `
    <p>Классический сапёр: под клетками спрятаны мины, а цифры показывают, сколько мин среди соседей.</p>
    <p>Управление: левая кнопка / тап — открыть клетку, правая кнопка — поставить флаг, двойной клик по открытой цифре — аккорд (открыть соседей, если флагов уже достаточно). На телефоне: тап — открыть или флаг (смотря какой режим выбран кнопкой сверху), долгий тап — флаг.</p>
    <p>Первый клик всегда безопасен и никогда не окажется миной.</p>
  `, [{label:'Понятно', primary:true, action:closeSheet}]);
}

function openSheet(title, body, buttons){
  el('sheetTitle').textContent = title;
  el('sheetBody').innerHTML = body;
  const row = el('sheetRow');
  row.innerHTML = '';
  for(const b of buttons){
    const btn = document.createElement('button');
    btn.className = 'btn' + (b.primary ? ' primary' : '');
    btn.textContent = b.label;
    btn.onclick = () => { closeSheet(); b.action(); };
    row.appendChild(btn);
  }
  el('scrim').classList.add('on');
  row.firstChild?.focus();
}
function closeSheet(){ el('scrim').classList.remove('on'); }

/* ---------------- input ---------------- */
let pressTimer = null, longPressed = false;

boardEl.addEventListener('contextmenu', e => {
  e.preventDefault();
  const i = indexFrom(e.target);
  if(i >= 0) toggleFlag(i);
});

boardEl.addEventListener('mousedown', e => {
  const i = indexFrom(e.target);
  if(i < 0) return;
  if(e.button === 1){ e.preventDefault(); chord(i); }
});

boardEl.addEventListener('click', e => {
  const i = indexFrom(e.target);
  if(i < 0 || longPressed) return;
  cursor = i;
  if(G.revealed[i]){ chord(i); paintCursor(); return; }
  if(flagMode) toggleFlag(i);
  else reveal(i);
  paintCursor();
});

boardEl.addEventListener('dblclick', e => {
  const i = indexFrom(e.target);
  if(i >= 0) chord(i);
});

boardEl.addEventListener('touchstart', e => {
  const i = indexFrom(e.target);
  if(i < 0) return;
  longPressed = false;
  pressTimer = setTimeout(() => {
    longPressed = true;
    toggleFlag(i);
    if(navigator.vibrate) navigator.vibrate(18);
  }, 380);
}, {passive:true});

const cancelPress = () => { clearTimeout(pressTimer); setTimeout(() => longPressed = false, 60); };
boardEl.addEventListener('touchend', cancelPress);
boardEl.addEventListener('touchmove', cancelPress, {passive:true});

function indexFrom(target){
  const cell = target.closest('.cell');
  return cell ? Number(cell.dataset.i) : -1;
}

function paintCursor(){
  for(const c of cells) c.classList.remove('cursor');
  cells[cursor]?.classList.add('cursor');
}

boardEl.addEventListener('keydown', e => {
  const x = cursor % W, y = Math.floor(cursor / W);
  const moves = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
  if(moves[e.key]){
    e.preventDefault();
    const nx = Math.min(W-1, Math.max(0, x + moves[e.key][0]));
    const ny = Math.min(H-1, Math.max(0, y + moves[e.key][1]));
    cursor = ny*W + nx;
    paintCursor();
    return;
  }
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); G.revealed[cursor] ? chord(cursor) : reveal(cursor); paintCursor(); }
  if(e.key.toLowerCase() === 'f' || e.key.toLowerCase() === 'а'){ e.preventDefault(); toggleFlag(cursor); paintCursor(); }
});

el('restart').onclick = newGame;
el('help').onclick = showHelp;
el('mode').onclick = () => {
  flagMode = !flagMode;
  const b = el('mode');
  b.setAttribute('aria-pressed', String(flagMode));
  b.lastChild.textContent = flagMode ? ' Режим: флаг' : ' Режим: открыть';
};
el('scrim').onclick = e => { if(e.target === el('scrim')) closeSheet(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

el('diffs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  difficulty = btn.dataset.d;
  for(const b of el('diffs').children) b.setAttribute('aria-pressed', String(b === btn));
  newGame();
});

newGame();
</script>
